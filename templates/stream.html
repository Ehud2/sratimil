<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צפייה קבוצתית ב-{{ movie.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stream.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="icon" href="/static/images/MoviesIL Logo.png" type="image/png">
</head>
<body>

<header class="site-header">
    <div class="container header-content">
        <a href="{{ url_for('index') }}" class="logo-link">
            <img src="{{ url_for('static', filename='images/MoviesIL Logo.png') }}" alt="סינמה פריים לוגו" class="logo">
        </a>
        <nav class="main-nav">
            <a href="{{ url_for('index') }}"><i class="fas fa-home"></i> בית</a>
            <a href="{{ url_for('all_movies') }}"><i class="fas fa-film"></i> סרטים</a>
            <a href="{{ url_for('all_series') }}"><i class="fas fa-tv"></i> סדרות</a>
        </nav>
        <div class="auth-container">
            {% if user %}
                <a href="{{ url_for('logout') }}" class="profile-button" title="התנתק">
                    <img src="{{ user.picture or url_for('static', filename='images/default-profile.png') }}" alt="{{ user.name or 'משתמש' }}">
                </a>
            {% endif %}
        </div>
    </div>
</header>

<main class="container stream-page">
    <div class="stream-layout">
        <div class="video-container">
            <h1>צופים ב: {{ movie.title }}</h1>
            <div class="vidsrc-embed-container">
                <iframe src="https://vidsrc.xyz/embed/movie?imdb={{ movie.imdbID }}" allowfullscreen referrerpolicy="origin"></iframe>
            </div>
            <div class="sync-controls">
                <p>כדי לסנכרן את הצפייה, מומלץ שכולם יתחילו את הסרט באותו הזמן. השתמשו בצ'אט כדי לתאם!</p>
            </div>
        </div>

        <div class="sidebar">
            <div class="participants-container">
                <h3>משתתפים (<span id="participant-count">0</span>)</h3>
                <ul id="participants-list">
                </ul>
                <button id="invite-button" class="invite-btn"><i class="fas fa-user-plus"></i> הזמנת משתתפים</button>
            </div>

            <div class="chat-container">
                <h3>צ'אט קבוצתי</h3>
                <div class="chat-messages" id="chat-messages">
                </div>
                <div class="chat-input-container">
                    <input type="text" id="chat-input" placeholder="כתוב הודעה...">
                    <button id="send-chat-button"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const currentUser = {{ user | tojson }};
        const groupId = {{ group_id | tojson }};
        let groupData = {{ group_data | tojson }};
        let userSids = {};

        const socket = io();

        socket.on('connect', () => {
            socket.emit('join_group_room', { group_id: groupId });
        });

        const participantsList = document.getElementById('participants-list');
        const participantCount = document.getElementById('participant-count');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendChatButton = document.getElementById('send-chat-button');
        const inviteButton = document.getElementById('invite-button');

        function renderParticipants() {
            participantsList.innerHTML = '';
            const participants = groupData.participants || {};
            const participantIds = Object.keys(participants);
            participantCount.textContent = participantIds.length;
            
            const sortedParticipants = participantIds.sort((a, b) => {
                if (a === groupData.host_id) return -1;
                if (b === groupData.host_id) return 1;
                return participants[a].name.localeCompare(participants[b].name);
            });

            sortedParticipants.forEach(id => {
                const isHost = id === groupData.host_id;
                participantsList.appendChild(createParticipantElement(id, participants[id], isHost));
            });
        }

        function createParticipantElement(id, participant, isHost) {
            const li = document.createElement('li');
            li.dataset.userId = id;
            li.innerHTML = `
                <img src="${participant.picture}" alt="${participant.name}" class="participant-avatar">
                <span class="participant-name">${participant.name}</span>
                ${isHost ? '<i class="fas fa-crown host-icon"></i>' : ''}
            `;
            
            if (currentUser.google_id === groupData.host_id && !isHost) {
                const actions = document.createElement('div');
                actions.className = 'participant-actions';
                actions.innerHTML = `
                    <button class="action-btn promote-btn" title="הפוך למנהל"><i class="fas fa-user-shield"></i></button>
                    <button class="action-btn kick-btn" title="הוצא מהקבוצה"><i class="fas fa-user-times"></i></button>
                `;
                li.appendChild(actions);

                actions.querySelector('.kick-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`האם אתה בטוח שברצונך להוציא את ${participant.name}?`)) {
                        socket.emit('kick_participant', { group_id: groupId, target_user_id: id, sid: userSids[id] });
                    }
                });
                
                actions.querySelector('.promote-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                     if (confirm(`האם אתה בטוח שברצונך להפוך את ${participant.name} למנהל החדש?`)) {
                        socket.emit('promote_to_host', { group_id: groupId, target_user_id: id });
                    }
                });
            }
            return li;
        }
        
        function addChatMessage(data) {
            const messageElement = document.createElement('div');
            messageElement.className = 'chat-message';
            const isCurrentUser = data.user_name === currentUser.name;
            if (isCurrentUser) {
                messageElement.classList.add('current-user');
            }

            messageElement.innerHTML = `
                <img src="${data.user_picture}" alt="${data.user_name}" class="chat-avatar">
                <div class="message-content">
                    <span class="chat-user-name">${data.user_name}</span>
                    <p class="message-text">${escapeHTML(data.message)}</p>
                </div>
            `;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                }[tag] || tag)
            );
        }

        function sendMessage() {
            const message = chatInput.value.trim();
            if (message) {
                socket.emit('send_chat_message', { group_id: groupId, message: message });
                chatInput.value = '';
            }
        }

        sendChatButton.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        inviteButton.addEventListener('click', () => {
            const joinUrl = `${window.location.origin}/stream/join/${groupId}`;
            navigator.clipboard.writeText(joinUrl).then(() => {
                alert('קישור ההזמנה הועתק!');
            }, () => {
                alert('שגיאה בהעתקת הקישור.');
            });
        });

        socket.on('user_joined', (data) => {
            groupData.participants[data.user_id] = data.user_info;
            userSids[data.user_id] = data.sid;
            renderParticipants();
            addSystemMessage(`${data.user_info.name} הצטרף לקבוצה.`);
        });

        socket.on('update_group_data', (data) => {
            if (!data.group_data.participants) {
                addSystemMessage("הקבוצה התפרקה.");
                setTimeout(() => window.location.href = "{{ url_for('index') }}", 2000);
                return;
            }
            
            const oldParticipants = new Set(Object.keys(groupData.participants || {}));
            const newParticipants = new Set(Object.keys(data.group_data.participants || {}));

            const joined = [...newParticipants].filter(x => !oldParticipants.has(x));
            const left = [...oldParticipants].filter(x => !newParticipants.has(x));

            groupData = data.group_data;
            renderParticipants();

            if (left.length > 0) {
                 addSystemMessage("משתמש עזב את הקבוצה.");
            }
        });
        
        socket.on('new_chat_message', (data) => {
            addChatMessage(data);
        });

        socket.on('you_were_kicked', (data) => {
            if(data.group_id === groupId) {
                alert('הוצאת מהקבוצה על ידי המנהל.');
                window.location.href = "{{ url_for('index') }}";
            }
        });

        function addSystemMessage(text) {
             const messageElement = document.createElement('div');
             messageElement.className = 'chat-message system-message';
             messageElement.textContent = text;
             chatMessages.appendChild(messageElement);
             chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        renderParticipants();
    });
</script>
</body>
</html>
