<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צפייה קבוצתית - {{ movie.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stream.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="icon" href="/static/images/MoviesIL Logo.png" type="image/png">
    <meta name="referrer" content="origin">
</head>
<body>

<div class="stream-container">
    <main class="stream-main-content">
        <h1>{{ movie.HebrewName or movie.title }}</h1>
        <p class="movie-meta">{{ movie.year }} | {{ movie.runtime }} | {{ movie.genre }}</p>

        <div class="vidsrc-embed-container">
            <iframe
                src="https://vidsrc.xyz/embed/movie?imdb={{ movie.imdbID }}"
                allowfullscreen
                allow="autoplay; encrypted-media"
                referrerpolicy="origin">
            </iframe>
        </div>

        <div class="stream-actions">
            <button id="invite-btn" class="stream-btn invite"><i class="fas fa-user-plus"></i> הזמן חברים</button>
            <button id="leave-btn" class="stream-btn leave"><i class="fas fa-sign-out-alt"></i> עזוב קבוצה</button>
        </div>
    </main>

    <aside class="stream-sidebar">
        <h2>משתתפים (<span id="participant-count">0</span>)</h2>
        <div id="participants-list" class="participants-list">
        </div>
    </aside>
</div>

<div id="context-menu" class="context-menu">
    <ul>
        <li id="context-make-host"><i class="fas fa-crown"></i> הפוך למנהל</li>
        <li id="context-kick"><i class="fas fa-user-slash"></i> הוצא מהקבוצה</li>
    </ul>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const groupId = {{ group_id | tojson }};
        const currentUser = {{ user | tojson }};
        const participantsList = document.getElementById('participants-list');
        const participantCount = document.getElementById('participant-count');
        const inviteBtn = document.getElementById('invite-btn');
        const leaveBtn = document.getElementById('leave-btn');
        const contextMenu = document.getElementById('context-menu');
        let pollingInterval;

        function renderParticipants(groupData) {
            participantsList.innerHTML = '';
            const participants = groupData.participants || {};
            const hostEmail = groupData.host_email;
            const participantEmails = Object.keys(participants);
            participantCount.textContent = participantEmails.length;

            const sortedEmails = participantEmails.sort((a, b) => {
                if (a === hostEmail) return -1;
                if (b === hostEmail) return 1;
                return participants[a].name.localeCompare(participants[b].name);
            });

            sortedEmails.forEach(email => {
                const participant = participants[email];
                const isHost = email === hostEmail;
                const isCurrentUser = email === currentUser.email;

                const participantDiv = document.createElement('div');
                participantDiv.className = 'participant-item';
                participantDiv.dataset.email = email;
                if (isCurrentUser) {
                    participantDiv.classList.add('current-user');
                }

                const img = document.createElement('img');
                img.src = participant.picture || '/static/images/default-profile.png';
                img.alt = participant.name;
                participantDiv.appendChild(img);

                const nameSpan = document.createElement('span');
                nameSpan.textContent = participant.name;
                participantDiv.appendChild(nameSpan);

                if (isHost) {
                    const hostIcon = document.createElement('i');
                    hostIcon.className = 'fas fa-crown host-icon';
                    hostIcon.title = 'מנהל הקבוצה';
                    participantDiv.appendChild(hostIcon);
                }

                participantsList.appendChild(participantDiv);
            });
        }

        async function fetchGroupStatus() {
            try {
                const response = await fetch(`/api/stream/${groupId}/status`);
                if (response.status === 404 || response.status === 403) {
                    clearInterval(pollingInterval);
                    alert('הקבוצה התפרקה או שהוצאת ממנה.');
                    window.location.href = "{{ url_for('index') }}";
                    return;
                }
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderParticipants(data);
            } catch (error) {
                console.error("Failed to fetch group status:", error);
                clearInterval(pollingInterval);
            }
        }

        async function performAction(url, body) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    alert(`שגיאה: ${errorData.error || 'פעולה נכשלה'}`);
                }
                return response.json();
            } catch (error) {
                console.error('Action failed:', error);
                alert('שגיאת רשת. נסה שוב.');
            }
        }

        inviteBtn.addEventListener('click', () => {
            const joinUrl = `${window.location.origin}{{ url_for('join_stream_group', group_id='') }}${groupId}`;
            navigator.clipboard.writeText(joinUrl).then(() => {
                alert('קישור ההזמנה הועתק!');
            }, (err) => {
                console.error('Could not copy text: ', err);
                alert('שגיאה בהעתקת הקישור.');
            });
        });

        leaveBtn.addEventListener('click', async () => {
            if (confirm('האם אתה בטוח שברצונך לעזוב את הקבוצה?')) {
                clearInterval(pollingInterval);
                await performAction(`/api/stream/${groupId}/leave`, {});
                window.location.href = "{{ url_for('index') }}";
            }
        });
        
        window.addEventListener('beforeunload', () => {
            navigator.sendBeacon(`/api/stream/${groupId}/leave`, new Blob());
        });

        document.addEventListener('click', (e) => {
            contextMenu.style.display = 'none';
        });

        participantsList.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const targetParticipant = e.target.closest('.participant-item');
            if (!targetParticipant) return;

            fetch(`/api/stream/${groupId}/status`).then(res => res.json()).then(groupData => {
                 if (currentUser.email !== groupData.host_email) return;

                 const targetEmail = targetParticipant.dataset.email;
                 if (targetEmail === currentUser.email) return;

                contextMenu.style.top = `${e.clientY}px`;
                contextMenu.style.left = `${e.clientX}px`;
                contextMenu.style.display = 'block';
                contextMenu.dataset.targetEmail = targetEmail;
            });
        });
        
        document.getElementById('context-make-host').addEventListener('click', async () => {
            const email = contextMenu.dataset.targetEmail;
            if (email) {
                await performAction(`/api/stream/${groupId}/make_host`, { email });
                fetchGroupStatus();
            }
        });
        
        document.getElementById('context-kick').addEventListener('click', async () => {
            const email = contextMenu.dataset.targetEmail;
            if (email) {
                 await performAction(`/api/stream/${groupId}/kick`, { email });
                 fetchGroupStatus();
            }
        });

        fetchGroupStatus();
        pollingInterval = setInterval(fetchGroupStatus, 3000);
    });
</script>

</body>
</html>
